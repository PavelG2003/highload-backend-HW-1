name: items-monitoring

x-app: &app
  image: items-service:local
  build: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    start_period: 45s
    retries: 20

services:
  app-1:
    <<: *app
    environment:
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - "127.0.0.1:${APP_1_PORT:-8080}:8080"

  app-2:
    <<: *app
    environment:
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - "127.0.0.1:${APP_2_PORT:-8081}:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env first}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  dashboard-generator:
    image: python:3.13.7-alpine3.22
    restart: "no"
    working_dir: /tools
    command: ["python", "-u", "generate_dashboard.py"]
    environment:
      APP_URL: http://app-1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env first}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tools:/tools:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  load-generator:
    image: python:3.13.7-alpine3.22
    restart: unless-stopped
    working_dir: /tools
    command: ["python", "-u", "load.py"]
    init: true
    environment:
      APP_URLS: http://app-1:8080,http://app-2:8080
      TARGET_RPS: ${TARGET_RPS:-30}
      RAMP_SECONDS: ${RAMP_SECONDS:-120}
      ERROR_FRACTION: "0.04"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tools:/tools:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully

  verifier:
    image: python:3.13.7-alpine3.22
    profiles: [tools]
    working_dir: /tools
    command: ["python", "-u", "verify_stack.py"]
    environment:
      APP_URLS: http://app-1:8080,http://app-2:8080
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Copy .env.example to .env first}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tools:/tools:ro

volumes:
  prometheus-data:
  grafana-data:
